[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hebom-buffer"
version = "1.0.0"
description = "Deduplication, expiry and ordering at the boundary between AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Space A", email = "hello@justholdings.io" }]
keywords = ["ai", "agents", "a2a", "mcp", "handoff", "buffer", "reliability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hebom-ai/hebom-buffer"
Issues = "https://github.com/hebom-ai/hebom-buffer/issues"

[tool.setuptools.packages.find]
include = ["hebom*"]
